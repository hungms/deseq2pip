url: https://hungms.github.io/deseq2pip/
authors:
  Matthew Hung:
    href: https://hungms.github.io/Portfolio/
template:
  bootstrap: 5
  bootswatch: flatly
navbar:
  structure:
    left:
    - intro
    - articles
    - reference
    - news
    right:
    - search
    - github
    - lightswitch
articles:
- title: Articles
  navbar: ~
  contents:
  - rna_guide
  - gsea_collection
  - session_info
reference:
- title: Pipeline Functions
  contents:
  - matches("run_rna_pip")
  - matches("run_atac_pip")
  - matches("pip")
- title: Wrapper Functions
  contents:
  - matches("wrapper")
- title: Quality Control (Module 1)
  contents:
  - starts_with("remove_")
  - matches("library")
  - matches("batch")
  - matches("pca")
  - matches("distance")
- title: Differential Expression (Module 2)
  contents:
  - matches("diffexp")
- title: Gene Set Enrichment Analysis (Module 3)
  contents:
  - matches("gsea")
  - matches("enrichmentmap")
  - matches("cls")
- title: Plot Functions (Module 4)
  contents:
  - starts_with("plot_")
- title: Helper Functions
  contents:
  - starts_with("import_")
  - starts_with("get")
  - matches("summarize_genes")
  - matches("comparison")
- title: Validation Functions
  contents:
  - matches("validate")
- title: Save Functions
  contents:
  - matches("save")
- title: Logging Functions
  contents:
  - starts_with("log_")

